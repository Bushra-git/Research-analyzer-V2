x-python-env: &python-env
  INTERNAL_API_TOKEN: ${INTERNAL_API_TOKEN:?Run node scripts/setup-env.js first}
  DATABASE_URL: postgresql://research:${POSTGRES_PASSWORD:?Database password required}@postgres:5432/research_paper_analyzer
  REDIS_URL: redis://redis:6379/0
  RETENTION_HOURS: ${RETENTION_HOURS:-24}
  SEMANTIC_SIMILARITY_ENABLED: ${SEMANTIC_SIMILARITY_ENABLED:-true}
  OCR_ENABLED: ${OCR_ENABLED:-false}
  TESSDATA_PREFIX: /usr/share/tesseract-ocr/5/tessdata
  OPENALEX_API_KEY: ${OPENALEX_API_KEY:-}

services:
  frontend:
    build: ./frontend
    ports: ["127.0.0.1:3000:80"]
    depends_on: [backend]
    networks:
      app-network:
        ipv4_address: 172.29.50.10
    restart: unless-stopped
  backend:
    build: ./backend
    environment:
      BACKEND_PORT: 3001
      NODE_ENV: ${NODE_ENV:-development}
      FLASK_API_URL: http://flask:5000
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-http://localhost:3000}
      DATABASE_URL: postgresql://research:${POSTGRES_PASSWORD:?Database password required}@postgres:5432/research_paper_analyzer
      JWT_SECRET: ${JWT_SECRET:?JWT secret required}
      INTERNAL_API_TOKEN: ${INTERNAL_API_TOKEN:?Internal token required}
      TRUSTED_PROXIES: 172.29.50.10/32
      RETENTION_HOURS: ${RETENTION_HOURS:-24}
    depends_on:
      postgres: {condition: service_healthy}
      flask: {condition: service_started}
    networks: [app-network]
    restart: unless-stopped
  flask:
    build:
      context: .
      args:
        INSTALL_SEMANTIC_MODEL: ${INSTALL_SEMANTIC_MODEL:-true}
    environment: *python-env
    depends_on:
      postgres: {condition: service_healthy}
      redis: {condition: service_healthy}
    networks: [app-network]
    restart: unless-stopped
  worker:
    build:
      context: .
      args:
        INSTALL_SEMANTIC_MODEL: ${INSTALL_SEMANTIC_MODEL:-true}
    command: ["python", "worker.py"]
    environment: *python-env
    depends_on:
      postgres: {condition: service_healthy}
      redis: {condition: service_healthy}
    networks: [app-network]
    stop_grace_period: 30s
    restart: unless-stopped
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: research
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Database password required}
      POSTGRES_DB: research_paper_analyzer
    volumes: [postgres_data:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U research -d research_paper_analyzer"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks: [app-network]
    restart: unless-stopped
  redis:
    image: redis:7-alpine
    # Manuscripts and job results are ephemeral; never persist them to an RDB/AOF volume.
    command: ["redis-server", "--save", "", "--appendonly", "no", "--maxmemory", "512mb", "--maxmemory-policy", "noeviction"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks: [app-network]
    restart: unless-stopped
volumes:
  postgres_data:
networks:
  app-network:
    driver: bridge
    ipam:
      config: [{subnet: 172.29.50.0/24}]
